name: Build and Push to ECR - Develop

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
      image_tag: ${{ steps.version.outputs.version }}-dev-${{ steps.sha.outputs.short_sha }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: gradle build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::234401909199:role/github-actions-role
        aws-region: eu-west-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Extract version from build.gradle
      id: version
      run: |
        VERSION=$(grep "version = " build.gradle | sed "s/version = '//" | sed "s/'//")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Get short SHA
      id: sha
      run: |
        SHORT_SHA=${GITHUB_SHA:0:7}
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "Short SHA: $SHORT_SHA"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push multi-arch image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/demo-app:${{ steps.version.outputs.version }}-dev-${{ steps.sha.outputs.short_sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout helm-demo-app repository
      uses: actions/checkout@v4
      with:
        repository: ramilano/helm-demo-app
        ref: develop
        token: ${{ secrets.GITHUB_TOKEN }}
        path: helm-demo-app

    - name: Update Chart.yaml appVersion
      run: |
        cd helm-demo-app
        APP_VERSION="${{ needs.build-and-push.outputs.image_tag }}"
        
        # Update the appVersion in Chart.yaml
        sed -i "s/^appVersion: .*/appVersion: $APP_VERSION/" Chart.yaml
        
        echo "Updated appVersion to: $APP_VERSION"
        cat Chart.yaml | grep "appVersion:"

    - name: Commit and push changes
      run: |
        cd helm-demo-app
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git add Chart.yaml
        git commit -m "Update appVersion to ${{ needs.build-and-push.outputs.image_tag }}"
        git push origin develop
