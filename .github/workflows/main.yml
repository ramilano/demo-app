name: Retag and Push to ECR - Main

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  retag-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::234401909199:role/github-actions-role
        aws-region: eu-west-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Extract version from build.gradle
      id: version
      run: |
        VERSION=$(grep "version = " build.gradle | sed "s/version = '//" | sed "s/'//")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Find RC image with latest commit
      id: find-rc
      run: |
        SHORT_SHA=${GITHUB_SHA:0:7}
        RC_TAG="${{ steps.version.outputs.version }}-rc-$SHORT_SHA"
        ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
        
        echo "Looking for RC image: $ECR_REGISTRY/demo-app:$RC_TAG"
        
        # Check if the RC image exists
        aws ecr describe-images --repository-name demo-app --image-ids imageTag=$RC_TAG --region eu-west-1 || IMAGE_EXISTS=$?
        if [ -z "$IMAGE_EXISTS" ]; then
          echo "rc_tag=$RC_TAG" >> $GITHUB_OUTPUT
          echo "rc_exists=true" >> $GITHUB_OUTPUT
          echo "Found RC image: $RC_TAG"
        else
          echo "rc_exists=false" >> $GITHUB_OUTPUT
          echo "RC image not found: $RC_TAG"
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Pull, retag and push production image
      if: steps.find-rc.outputs.rc_exists == 'true'
      run: |
        ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
        RC_TAG="${{ steps.find-rc.outputs.rc_tag }}"
        VERSION="${{ steps.version.outputs.version }}"
        
        # Pull the multi-arch RC image
        docker buildx imagetools inspect $ECR_REGISTRY/demo-app:$RC_TAG
        
        # Create new tags for production
        docker buildx imagetools create \
          $ECR_REGISTRY/demo-app:$RC_TAG \
          --tag $ECR_REGISTRY/demo-app:$VERSION \
          --tag $ECR_REGISTRY/demo-app:latest
        
        echo "Successfully retagged and pushed:"
        echo "  $ECR_REGISTRY/demo-app:$VERSION"
        echo "  $ECR_REGISTRY/demo-app:latest"

  deploy:
    needs: retag-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout helm-demo-app repository
      uses: actions/checkout@v4
      with:
        repository: ramilano/helm-demo-app
        ref: main
        token: ${{ secrets.PAT_TOKEN }}
        path: helm-demo-app

    - name: Update Chart.yaml appVersion
      run: |
        cd helm-demo-app
        APP_VERSION="${{ needs.retag-and-push.outputs.version }}"
        
        # Update the appVersion in Chart.yaml
        sed -i "s/^appVersion: .*/appVersion: $APP_VERSION/" Chart.yaml
        
        echo "Updated appVersion to: $APP_VERSION"
        cat Chart.yaml | grep "appVersion:"

    - name: Commit and push changes
      run: |
        cd helm-demo-app
        git config user.name "GitHub Actions"
        git config user.email "<>"
        
        git add Chart.yaml
        git commit -m "Update appVersion to ${{ needs.retag-and-push.outputs.version }}"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}